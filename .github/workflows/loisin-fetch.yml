name: loisin-fetch
on:
  push:
    branches: [fetch-data]
    paths: [".github/workflows/loisin-fetch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd loisin-fetch && bash fetch.sh
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add -A loisin-fetch/data
          git commit -m "data" || true
          git push origin HEAD:fetch-data
