name: west-fetch
on:
  push:
    branches: [west-fetch]
    paths: [".github/workflows/west-fetch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: cd west-fetch && bash fetch.sh
        timeout-minutes: 40
        continue-on-error: true
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add -A west-fetch/data
          git commit -m "data" || true
          git push origin HEAD:west-fetch
        if: always()
