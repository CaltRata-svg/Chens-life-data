name: douvaine-fetch
on:
  push:
    branches: [fetch-data]
    paths: [".github/workflows/douvaine-fetch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd douvaine-fetch && bash fetch.sh
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add -A douvaine-fetch/data
          git commit -m "data" || true
          git push origin HEAD:fetch-data
