name: big-fetch
on:
  push:
    branches: [big-fetch]
    paths: [".github/workflows/big-fetch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: cd big-fetch && bash fetch.sh
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add -A big-fetch/data
          git commit -m "data" || true
          git push origin HEAD:big-fetch
