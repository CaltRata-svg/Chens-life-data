name: south-fetch
on:
  push:
    branches: [south-fetch]
    paths: [".github/workflows/south-fetch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: cd south-fetch && bash fetch.sh
        timeout-minutes: 80
        continue-on-error: true
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add -A south-fetch/data
          git commit -m "data" || true
          git push origin HEAD:south-fetch
        if: always()
